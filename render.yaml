services:
  - type: web
    name: aagazz-backend
    runtime: python
    rootDir: aagazz-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: EVENT_ACCESS_CODE
        value: AAGAZZ2026
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BREVO_API_KEY_1
        sync: false
      - key: BREVO_API_KEY_2
        sync: false
      - key: BREVO_SENDER_NAME
        value: Aagaaz
      - key: BREVO_SENDER_EMAIL
        value: asamol918@gmail.com
      - key: DEV_OTP_MODE
        value: "false"

